# Nginx configuration for the self-hosted (Express) deployment of tagyfy.com.
#
# This file is the alternative to the Vercel deployment described in
# DEPLOYMENT.md — use one or the other, not both. It assumes:
#   * the frontend is built with `npm run build:prerender` into /var/www/tagyfy/dist
#   * the API/streaming backend from server/ is listening on 127.0.0.1:4000
#
# Before using it:
#   1. Replace tagyfy.com in server_name / ssl_certificate if you serve a
#      different host.
#   2. Confirm the dist path in `root` matches your build output.
#   3. Reload: nginx -t && systemctl reload nginx
#
# Two things this file deliberately does NOT do, both of which were wrong in the
# earlier draft of it:
#   * It does not proxy `location /download`. /download is a real prerendered
#     page (dist/download/index.html); proxying it to the installer endpoint hid
#     the page from users and from Google while the installer download swallowed
#     the URL. The installer lives at /api/download/latest instead.
#   * It is not two copies of the same server block. Nginx reads the first
#     matching block and ignores the duplicate, so a second copy with stale
#     settings is worse than no second copy.

# Rate limiting must be declared in the http context. If your nginx.conf already
# defines zone "one", delete this block rather than duplicating the name.
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

# ── www → apex ──────────────────────────────────────────────────────────────
# One canonical host, so tagyfy.com and www.tagyfy.com are not two URLs with
# identical content.
server {
  listen 80;
  listen 443 ssl;
  http2 on;
  server_name www.tagyfy.com;

  # Replace these two paths if you keep certificates elsewhere.
  ssl_certificate     /etc/letsencrypt/live/tagyfy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tagyfy.com/privkey.pem;

  return 301 https://tagyfy.com$request_uri;
}

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
  listen 80;
  server_name tagyfy.com;

  # Leave the ACME challenge reachable over plain HTTP for certbot renewals.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── Main site ───────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name tagyfy.com;

  ssl_certificate     /etc/letsencrypt/live/tagyfy.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tagyfy.com/privkey.pem;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root  /var/www/tagyfy/dist;
  index index.html;

  access_log /var/log/nginx/tagyfy.access.log;
  error_log  /var/log/nginx/tagyfy.error.log warn;

  # Installers are large and are not uploaded to this server, but the contact
  # endpoint accepts form posts; 25M is enough headroom for those.
  client_max_body_size 25M;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss image/svg+xml;

  # ── Security headers ──────────────────────────────────────────────────────
  # Note: add_header is not inherited into a `location` that defines its own
  # headers, so the caching locations below repeat the strict-transport one.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # The site embeds nothing and is embedded nowhere; AdSense and Google
  # Analytics are the only third parties loaded, and both are first-party
  # script tags.
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # ── API and installer streaming ───────────────────────────────────────────
  # server/ exposes exactly two endpoints: /api/contact and
  # /api/download/latest.
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;

    # Streaming a ~160 MB installer through this hop takes longer than the
    # default read timeout. Buffering is off so bytes reach the client as they
    # arrive rather than after the whole file is cached.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    proxy_request_buffering off;
  }

  # ── Crawler files ─────────────────────────────────────────────────────────
  location = /sitemap.xml {
    types { } default_type application/xml;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /robots.txt {
    types { } default_type text/plain;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # ads.txt must be served as text/plain or Google treats it as absent.
  location = /ads.txt {
    types { } default_type text/plain;
    try_files $uri =404;
  }

  # ── Immutable assets ──────────────────────────────────────────────────────
  # Vite emits content-hashed filenames, so these can be cached indefinitely.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
  }

  location ~* \.(?:css|js|jpg|jpeg|png|webp|avif|svg|gif|ico|woff2|woff|ttf)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
  }

  # ── SPA + prerendered routes ──────────────────────────────────────────────
  # `$uri/` matters: /download, /faq, /metadata-limits and every /blog/<slug>
  # exist on disk as directories containing index.html. Without the directory
  # match these resolve to the generic /index.html and lose their prerendered
  # content — which is exactly the content crawlers that do not run JavaScript
  # depend on.
  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
    limit_req zone=one burst=20 nodelay;
  }

  # ── Blocked paths ─────────────────────────────────────────────────────────
  location ~* (?:^|/)\.(?!well-known) {
    deny all;
  }

  location ~* \.(?:env|log|sql|bak|old|swp)$ {
    deny all;
  }
}
